research:
  - title: Agricultural Computer Vision and Foundation Models
    text: >-
      Adapting large-scale vision foundation models, including self-supervised vision transformers,
      to crop detection, fruit segmentation, pest monitoring, and field scene understanding, bridging
      general-purpose visual representation learning and domain-specific agricultural perception.
    work:
      - label: AgriDINO-seg
        doi: 10.13031/aim.202601108
      - label: Self-supervised pre-training for plant infection
        doi: 10.1007/978-981-97-8490-5_14
  - title: High-Throughput Plant Phenotyping
    text: >-
      AI-enabled systems for scalable, automated measurement of plant traits, using UAV and
      ground-robot sensing platforms, multimodal imaging, and deep learning to quantify growth, stress
      responses, disease symptoms, and yield.
    work:
      - label: JassidNet
        doi: 10.1016/j.indcrop.2026.123716
      - label: From Sensors to Insights
        doi: 10.1016/j.atech.2025.101257
  - title: Precision Agriculture and Intelligent Field Robotics
    text: >-
      Perception systems for autonomous agricultural robots in precision spraying, crop monitoring,
      and robotic harvesting, built as lightweight vision pipelines that stay reliable under occlusion,
      clutter, and varying illumination.
    work:
      - label: Field-adaptive mechanical weeding
        doi: 10.1002/rob.70230
      - label: Visual navigation review
        doi: 10.1016/j.compag.2026.111754
  - title: Agricultural AI Systems and Datasets
    text: >-
      High-quality annotated datasets for crop and pest monitoring, with reproducible evaluation
      pipelines that support reliable deployment of AI in real-world farming.
    work:
      - label: DLCPD-25
        doi: 10.3390/s25227098

