bio:
  - >-
    Rui-Feng Wang is an Agricultural Robotic Researcher in the Department of Agricultural and
    Biological Engineering at the University of Florida and the Principal AI-based Plant Phenotyping
    Researcher in the Cotton Molecular Breeding Lab at the University of Georgia. Wang's research
    develops computer vision, deep learning, and robotic systems for agriculture, with a focus on
    high-throughput plant phenotyping, precision agriculture, and agricultural robots.
  - >-
    Recent work includes quantization-aware phenotyping for cotton jassid resistance screening,
    real-time cotton boll and flower detection, DINOv3-based multi-crop semantic segmentation, and
    field-adaptive mechanical weeding in lettuce. Wang serves as a Guest Editor for
    <em>Plants</em> and as a reviewer for 21 journals.

